<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1e1e2e" />
    <meta name="description" content="Fast, offline-first calculator for Chromebook & Linux" />
    <link rel="apple-touch-icon" href="./pwa-192x192.png" />
    <title>Calculator</title>
  </head>
  <body>
    <div id="app">
      <main class="calculator-card">
        <header class="calc-header">
          <span class="app-title">Calculator</span>
          <div class="header-actions">
            <button id="mode-toggle" class="icon-button" title="Switch to Scientific Mode" aria-label="Toggle Calculator Mode">
              <!-- SVG injected dynamically by main.ts -->
            </button>
            <button id="about-btn" class="icon-button" title="About Calculator" aria-label="About">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="16" x2="12" y2="12"/>
                <line x1="12" y1="8" x2="12.01" y2="8"/>
              </svg>
            </button>
            <button id="theme-toggle" class="icon-button" title="Toggle Theme" aria-label="Toggle Theme">
              <svg id="theme-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
              </svg>
            </button>
          </div>
        </header>

        <section class="display-container" aria-live="polite">
          <div class="display-meta">
            <div class="badges-group">
              <span id="memory-indicator" class="memory-badge" title="Value stored in memory" aria-label="Memory active">M</span>
              <span id="angle-badge" class="angle-badge" title="Angle Mode" aria-label="Angle Mode">DEG</span>
            </div>
            <div id="history-display" class="history-display"></div>
          </div>
          <div id="main-display" class="main-display">0</div>
        </section>

        <section class="memory-bar" role="toolbar" aria-label="Memory Controls">
          <button id="mc-btn" class="mem-btn" data-action="memory-clear" title="Memory Clear (MC)" aria-label="Memory Clear" disabled>MC</button>
          <button id="mr-btn" class="mem-btn" data-action="memory-recall" title="Memory Recall (MR)" aria-label="Memory Recall" disabled>MR</button>
          <button id="mplus-btn" class="mem-btn" data-action="memory-add" title="Memory Add (M+)" aria-label="Memory Add">M+</button>
          <button id="mminus-btn" class="mem-btn" data-action="memory-subtract" title="Memory Subtract (M-)" aria-label="Memory Subtract">M−</button>
          <button id="ms-btn" class="mem-btn" data-action="memory-store" title="Memory Store (MS)" aria-label="Memory Store">MS</button>
        </section>

        <div class="keypads-wrapper">
          <!-- Scientific Keypad Panel -->
          <section id="scientific-keypad" class="scientific-keypad" role="grid" aria-label="Scientific Keys">
            <button class="key sci angle-btn" data-action="toggle-angle" aria-label="Toggle Degrees and Radians" title="Degrees or Radians"><span id="angle-btn-text">RAD</span></button>
            <button class="key sci" data-action="sin" aria-label="Sine">sin</button>
            <button class="key sci" data-action="cos" aria-label="Cosine">cos</button>
            <button class="key sci" data-action="tan" aria-label="Tangent">tan</button>

            <button class="key sci" data-action="pi" aria-label="Pi Constant">π</button>
            <button class="key sci" data-action="e" aria-label="Euler Constant">e</button>
            <button class="key sci" data-action="ln" aria-label="Natural Logarithm">ln</button>
            <button class="key sci" data-action="log10" aria-label="Logarithm Base 10">log</button>

            <button class="key sci" data-action="square" aria-label="Square">x²</button>
            <button class="key sci" data-action="cube" aria-label="Cube">x³</button>
            <button class="key sci" data-action="power" aria-label="Power">xʸ</button>
            <button class="key sci" data-action="sqrt" aria-label="Square Root">√x</button>

            <button class="key sci" data-action="cbrt" aria-label="Cube Root">∛x</button>
            <button class="key sci" data-action="exp" aria-label="e to power x">eˣ</button>
            <button class="key sci" data-action="exp10" aria-label="10 to power x">10ˣ</button>
            <button class="key sci" data-action="factorial" aria-label="Factorial">n!</button>

            <button class="key sci" data-action="reciprocal" aria-label="Reciprocal">1/x</button>
            <button class="key sci" data-action="abs" aria-label="Absolute Value">|x|</button>
            <button class="key sci" data-action="clear-entry" aria-label="Clear Entry">CE</button>
            <button class="key sci" data-action="random" aria-label="Random Number">RND</button>
          </section>

          <!-- Standard Numeric Keypad -->
          <section class="keypad" role="grid" aria-label="Numeric Keys">
            <button class="key func" data-action="clear" aria-label="Clear All">AC</button>
            <button class="key func" data-action="toggle-sign" aria-label="Positive or Negative">±</button>
            <button class="key func" data-action="percent" aria-label="Percent">%</button>
            <button class="key op" data-action="divide" aria-label="Divide">÷</button>

            <button class="key num" data-digit="7">7</button>
            <button class="key num" data-digit="8">8</button>
            <button class="key num" data-digit="9">9</button>
            <button class="key op" data-action="multiply" aria-label="Multiply">×</button>

            <button class="key num" data-digit="4">4</button>
            <button class="key num" data-digit="5">5</button>
            <button class="key num" data-digit="6">6</button>
            <button class="key op" data-action="subtract" aria-label="Subtract">−</button>

            <button class="key num" data-digit="1">1</button>
            <button class="key num" data-digit="2">2</button>
            <button class="key num" data-digit="3">3</button>
            <button class="key op" data-action="add" aria-label="Add">+</button>

            <button class="key num zero" data-digit="0">0</button>
            <button class="key num" data-action="decimal">.</button>
            <button class="key func" data-action="backspace" aria-label="Backspace">⌫</button>
            <button class="key equals" data-action="equals" aria-label="Equals">=</button>
          </section>
        </div>
      </main>

      <!-- About Dialog / Modal -->
      <dialog id="about-modal" class="about-dialog">
        <div class="about-content">
          <div class="about-header">
            <div class="about-badge">v1.0.0</div>
            <h2>Chromebook Calculator</h2>
          </div>
          <p class="about-desc">
            A fast, offline-first Progressive Web App designed for ChromeOS and Linux desktop environments.
          </p>
          <hr class="about-divider" />
          <div class="about-details">
            <div class="about-row">
              <span class="label">Author</span>
              <span class="value">David Vanhoucke</span>
            </div>
            <div class="about-row">
              <span class="label">Contact</span>
              <a class="value link" href="mailto:vanhouckedavid@gmail.com">vanhouckedavid@gmail.com</a>
            </div>
            <div class="about-row">
              <span class="label">License</span>
              <span class="value">GNU AGPLv3</span>
            </div>
            <div class="about-row">
              <span class="label">Copyright</span>
              <span class="value">&copy; 2026 David Vanhoucke</span>
            </div>
          </div>
          <button id="close-about-btn" class="close-btn" aria-label="Close dialog">Close</button>
        </div>
      </dialog>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
